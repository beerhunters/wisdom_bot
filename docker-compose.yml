x-environment-defaults: &environment-defaults
#  DEBUG: ${DEBUG}
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_HOST: ${POSTGRES_HOST}
  POSTGRES_PORT: ${POSTGRES_PORT}
  TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
#  CELERY_BROKER_URL: "redis://redis:6379/0"
#  CELERY_RESULT_BACKEND: "redis://redis:6379/0"
#  SECRET_KEY: ${SECRET_KEY}

services:

  wisdom_db:
    image: postgres:latest
    container_name: wisdom-db
    environment:
      <<: *environment-defaults
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - wisdom-network

  alembic:
    build:
      context: .alembic/  # Контекст сборки для Alembic
      dockerfile: alembic/Dockerfile  # Dockerfile для Alembic
    environment:
      <<: *environment-defaults  # Включаем те же переменные окружения для Alembic
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}  # Использование переменных для создания URL
    depends_on:
      - wisdom_db  # Ожидание готовности базы данных
    volumes:
      - .:/app  # Привязка текущего каталога к рабочему каталогу контейнера Alembic
    networks:
      - wisdom-network
    command: upgrade head  # Применение миграций при старте контейнера


  tg_bot:
    build:
      context: .  # Контекст сборки должен быть в корне проекта, а не внутри tg_bot
      dockerfile: tg_bot/Dockerfile
    container_name: tg-bot
    environment:
      <<: *environment-defaults
    depends_on:
      - wisdom_db  # Ожидание, пока база данных будет готова
    networks:
      - wisdom-network
    restart: always  # Чтобы бот перезапускался, если что-то пойдет не так

volumes:
  pg_data:

networks:
  wisdom-network:
    driver: bridge