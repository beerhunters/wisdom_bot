x-environment-defaults: &environment-defaults
#  DEBUG: "False"
  DB_NAME: ${DB_NAME}
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}
  DB_HOST: ${DB_HOST}
  DB_PORT: ${DB_PORT}
  TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
  DATABASE_URL: ${DATABASE_URL}
#  CELERY_BROKER_URL: "redis://redis:6379/0"
#  CELERY_RESULT_BACKEND: "redis://redis:6379/0"
  SECRET_KEY: ${SECRET_KEY}

services:

  wisdom-db:
    image: postgres:latest
    container_name: wisdom-db
    environment:
      <<: *environment-defaults
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - wisdom-network

  alembic:
    build:
      context: .  # Контекст сборки для Alembic
      dockerfile: alembic/Dockerfile  # Dockerfile для Alembic
    environment:
        <<: *environment-defaults
    depends_on:
      - wisdom-db  # Ожидание готовности базы данных
    volumes:
      - .:/app  # Привязка текущего каталога к рабочему каталогу контейнера Alembic
    networks:
      - wisdom-network
    working_dir: /app

  tg_bot:
    build:
      context: .  # Контекст сборки должен быть в корне проекта, а не внутри tg_bot
      dockerfile: tg_bot/Dockerfile
    container_name: tg-bot
    environment:
      <<: *environment-defaults
    depends_on:
      - wisdom-db  # Ожидание, пока база данных будет готова
    networks:
      - wisdom-network
    restart: always  # Чтобы бот перезапускался, если что-то пойдет не так

volumes:
  pg_data:

networks:
  wisdom-network:
    driver: bridge